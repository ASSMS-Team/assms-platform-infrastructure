name: ASE code quality

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ase-code-quality.yml
      - quality/sonarqube/**
  workflow_call:
    inputs:
      source_repository:
        description: Application repository that triggered this run
        required: true
        type: string
      source_sha:
        description: Exact commit that triggered this run
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch checked out from each application repository
        required: true
        default: dev
        type: choice
        options: [dev, ASE_Code_Quality_Metrics]
      project:
        description: Analysis scope
        required: true
        default: all
        type: choice
        options: [all, job, customer, dispatch, reporting, frontend]

permissions:
  contents: read

concurrency:
  group: ase-code-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Build, test, analyze and check gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SONAR_HOST_URL: http://127.0.0.1:9000
      ASSMS_DISPATCH_TEST_CONNECTION: 'Server=127.0.0.1;Port=3306;Database=dispatchdb_test;User ID=ase_test;Password=ase_ci_only;'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dispatchdb_test
          MYSQL_USER: ase_test
          MYSQL_PASSWORD: ase_ci_only
          MYSQL_ROOT_PASSWORD: ase_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out platform workflow
        uses: actions/checkout@v7
        with:
          repository: ASSMS-Team/assms-platform-infrastructure
          ref: ${{ github.repository == 'ASSMS-Team/assms-platform-infrastructure' && github.sha || 'dev' }}
          path: assms-platform-infrastructure
          persist-credentials: false
      - name: Check out Job Service
        uses: actions/checkout@v7
        with:
          repository: ASSMS-Team/assms-job-service
          ref: ${{ inputs.source_repository == 'assms-job-service' && inputs.source_sha || inputs.source_ref || 'dev' }}
          path: assms-job-service
          persist-credentials: false
      - name: Check out Customer and Asset Service
        uses: actions/checkout@v7
        with:
          repository: ASSMS-Team/assms-customer-asset-service
          ref: ${{ inputs.source_repository == 'assms-customer-asset-service' && inputs.source_sha || inputs.source_ref || 'dev' }}
          path: assms-customer-asset-service
          persist-credentials: false
      - name: Check out Dispatch Service
        uses: actions/checkout@v7
        with:
          repository: ASSMS-Team/assms-dispatch-service
          ref: ${{ inputs.source_repository == 'assms-dispatch-service' && inputs.source_sha || inputs.source_ref || 'dev' }}
          path: assms-dispatch-service
          persist-credentials: false
      - name: Check out Reporting Service
        uses: actions/checkout@v7
        with:
          repository: ASSMS-Team/assms-reporting-service
          ref: ${{ inputs.source_repository == 'assms-reporting-service' && inputs.source_sha || inputs.source_ref || 'dev' }}
          path: assms-reporting-service
          persist-credentials: false
      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          repository: ASSMS-Team/assms-frontend
          ref: ${{ inputs.source_repository == 'assms-frontend' && inputs.source_sha || inputs.source_ref || 'dev' }}
          path: assms-frontend
          persist-credentials: false
      - name: Verify triggering source revision
        if: ${{ inputs.source_repository != '' }}
        shell: pwsh
        env:
          ASE_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          ASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $allowed = @('assms-job-service', 'assms-customer-asset-service', 'assms-dispatch-service', 'assms-reporting-service', 'assms-frontend')
          if ($env:ASE_SOURCE_REPOSITORY -notin $allowed -or $env:ASE_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid reusable-workflow source repository or commit SHA.'
          }
          $actual = git -C $env:ASE_SOURCE_REPOSITORY rev-parse HEAD
          if ($actual -ne $env:ASE_SOURCE_SHA) {
            throw "Source checkout mismatch for $env:ASE_SOURCE_REPOSITORY."
          }
          Write-Output "Verified $env:ASE_SOURCE_REPOSITORY at $actual"
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check analysis helper tests
        shell: pwsh
        run: python -m unittest discover -s assms-platform-infrastructure/quality/sonarqube/tests -p 'test_*.py' -v
      - name: Prepare SonarQube host
        shell: bash
        run: sudo sysctl -w vm.max_map_count=524288
      - name: Start temporary SonarQube
        shell: pwsh
        run: '& ./assms-platform-infrastructure/quality/sonarqube/Start-SonarQube.ps1 -TimeoutSeconds 900'
      - name: Check analysis prerequisites
        shell: pwsh
        run: '& ./assms-platform-infrastructure/quality/sonarqube/Test-CiPrerequisites.ps1'
      - name: Analyze selected projects
        shell: pwsh
        run: '& ./assms-platform-infrastructure/quality/sonarqube/Run-Analysis.ps1 -Project ''${{ inputs.project || ''all'' }}'' -FailOnQualityGate -DispatchIntegrationDatabase'
      - name: Check ASE metric floor and evaluated gate
        shell: pwsh
        run: '& ./assms-platform-infrastructure/quality/sonarqube/Test-CiMetrics.ps1 -MinimumCoverage 35 -MaximumDuplication 10'
      - name: Write run summary
        if: always()
        shell: pwsh
        run: |
          $script = './assms-platform-infrastructure/quality/sonarqube/Write-CiSummary.ps1'
          if (Test-Path $script) { & $script } else { Write-Output 'No analysis script was checked out.' }
      - name: Upload analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ase-code-quality-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            assms-platform-infrastructure/quality/sonarqube/.local/analysis-runs/*/summary.json
            assms-*/quality/artifacts/*/quality-gate.json
            assms-*/quality/artifacts/*/sonarqube-metrics.json
            assms-*/quality/artifacts/*/TestResults/tests.trx
            assms-frontend/quality/artifacts/*/vitest.json
