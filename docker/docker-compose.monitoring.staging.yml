name: assms-monitoring-staging

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: assms-prometheus-staging
    restart: unless-stopped
    ports:
      # Bound to loopback interface on the host; remote access mediated through SSH port-forwarding
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus/config/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: assms-grafana-staging
    restart: unless-stopped
    ports:
      # Bound to loopback interface on the host; remote access mediated through SSH port-forwarding
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-assmsadmin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be configured in .env.monitoring.staging}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
    volumes:
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_staging_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_staging_data:
    name: assms-prometheus-staging-data
  grafana_staging_data:
    name: assms-grafana-staging-data
